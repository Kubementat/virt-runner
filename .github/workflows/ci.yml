# Continuous integration for virt-runner.
#
# Runs the checks that need no KVM: lint, format, and the pure-logic unit suite.
# The integration suite (`tests/integration_test.py`) creates and destroys real
# VMs and therefore is NOT run here — see CONTRIBUTING.md.

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported and newest common interpreter.
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check --output-format=github .

      - name: Format
        run: uv run ruff format --check .

      - name: Unit tests
        run: uv run tests/unit_test.py

      - name: Import smoke test
        run: uv run virt-runner --version && uv run virt-runner --help

      - name: Package builds
        run: uv build

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
      - name: shellcheck install-prerequisites.sh
        run: |
          sudo apt-get update -q && sudo apt-get install -y -qq shellcheck
          shellcheck -S warning install-prerequisites.sh
