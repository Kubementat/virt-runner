[project]
name = "virt-runner"
version = "0.2.0"
description = "One-command KVM VM creation via libvirt + cloud-init"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
]

[project.scripts]
virt-runner = "virt_runner.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/virt_runner"]

[dependency-groups]
dev = [
    "ruff>=0.9",
]

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = [
    "E4",    # import layout
    "E7",    # statement style
    "E9",    # syntax/runtime errors
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # bugbear
    "SIM",   # simplification
    "BLE",   # no blind `except Exception`
    "PIE",   # clean code
    "FURB",  # refurb
    "ISC",   # implicit string concatenation
    "PLW",   # pylint warnings (e.g. subprocess.run without check=)
]
